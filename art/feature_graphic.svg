  <text x="640" y="200" fill="#E8EAED" font-size="56" font-family="Inter, Rubik, Arial" font-weight="700">WOD Weekly Planner</text>
  <text x="640" y="260" fill="#A7B0C0" font-size="28" font-family="Inter, Rubik, Arial">Planifica tu semana con los WODs de tus boxes</text>
