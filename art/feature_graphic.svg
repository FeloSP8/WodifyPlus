      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#1A1F29"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Calendario de 7 días -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="520" height="260" rx="20" fill="#2E3A59"/>
    <rect x="0" y="0" width="520" height="60" rx="20" fill="#3A4768"/>
    <!-- 7 celdas -->
    <g fill="#485674" transform="translate(20,140)">
      <rect width="60" height="40" rx="6"/>
      <rect x="75" width="60" height="40" rx="6"/>
      <rect x="150" width="60" height="40" rx="6"/>
      <rect x="225" width="60" height="40" rx="6"/>
      <rect x="300" width="60" height="40" rx="6"/>
      <rect x="375" width="60" height="40" rx="6"/>
      <rect x="450" width="60" height="40" rx="6"/>
    </g>
    <!-- Kettlebell -->
    <g transform="translate(220,70)">
      <circle cx="40" cy="60" r="46" fill="#D7263D"/>
      <path d="M0,40 C0,18 18,0 40,0 62,0 80,18 80,40 H64 C64,29 55,20 40,20 25,20 16,29 16,40 Z" fill="#B61E33"/>
